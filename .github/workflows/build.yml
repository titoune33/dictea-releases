name: Construire et publier Dictéa
# Vit dans le dépôt PUBLIC (les binaires doivent être téléchargeables anonymement).
# Le code source est dans le dépôt PRIVÉ titoune33/dictea, lu via une deploy key (lecture seule).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, sans le v (ex. 0.1.1)"
        required: true
        default: "0.1.0"
      ref:
        description: "Ref du dépôt source à builder"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  release:
    name: Créer la release v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Release (idempotente)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "v${{ inputs.version }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v${{ inputs.version }}" -R "$GITHUB_REPOSITORY" --title "Dictéa ${{ inputs.version }}" --notes "Dictéa ${{ inputs.version }} — dictée vocale 100 % locale. macOS : glissez Dictéa dans Applications, puis clic droit → Ouvrir au premier lancement (app non signée). Windows : lancez le .exe, choisissez « Informer seulement » si SmartScreen s'affiche. Linux : chmod +x Dictea*.AppImage puis ./Dictea*.AppImage. Gratuit : 1000 mots/mois, sans compte. Transcription par NVIDIA Parakeet TDT 0.6B v3 (© NVIDIA Corporation, CC BY 4.0)."
          fi

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # `bundles` = types d'installeurs supportés par la plateforme hôte
          # (tauri.conf.json ne liste que dmg/app : sans override, Windows et
          # Linux produisent 0 installeur).
          - os: macos-latest
            target: aarch64-apple-darwin
            name: mac-silicon
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            name: mac-intel
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout du dépôt source privé
        uses: actions/checkout@v4
        with:
          repository: titoune33/dictea
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances npm
        shell: bash
        run: npm ci || npm install --no-audit --no-fund

      - name: Rust stable + cible
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        # alsa-sys (cpal → capture micro) exige libasound2-dev + pkg-config.
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev pkg-config

      - name: Vérifier que les modèles restent HORS de src/
        shell: bash
        run: |
          # Tout ce qui est sous src/ est embarqué dans le binaire Tauri :
          # un fichier de modèle y ferait retomber l'installeur à ~700 Mo.
          if [ -d src/models ]; then
            echo "::error::src/models existe — les modèles doivent vivre dans models/ (gitignoré)."
            exit 1
          fi
          echo "OK : src = $(du -sh src | cut -f1)"

      - name: Construire l'installeur
        shell: bash
        run: npx tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"

      - name: macOS — Resources + signature ad-hoc (sinon « disque endommagé »)
        if: runner.os == 'macOS'
        shell: bash
        # Même opération que src-tauri/scripts/bundle-macos.sh, mais sans ses
        # chemins codés en dur (target/release/, _aarch64.dmg) : en CI on passe
        # --target, donc le bundle vit dans target/<triple>/release/bundle.
        run: |
          set -eu
          app=$(find src-tauri/target -type d -name "*.app" | head -1)
          dmg=$(find src-tauri/target -type f -name "*.dmg" | head -1)
          [ -n "$app" ] && [ -n "$dmg" ] || { echo "::error::.app ou .dmg introuvable"; exit 1; }
          echo "app=$app"
          echo "dmg=$dmg"
          mkdir -p "$app/Contents/Resources"
          : > "$app/Contents/Resources/.keep"
          codesign --force --sign - "$app"
          codesign --verify --strict --deep --verbose=2 "$app"
          stage=$(mktemp -d)
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          rm -f "$dmg"
          hdiutil create -volname "Dictéa" -srcfolder "$stage" -ov -format UDZO \
            -imagekey zlib-level=9 "$dmg" >/dev/null
          rm -rf "$stage"
          echo "OK : $(stat -f%z "$dmg") octets"

      - name: Publier les fichiers sur la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          base="src-tauri/target/${{ matrix.target }}/release/bundle"
          files=( "$base"/dmg/*.dmg "$base"/msi/*.msi "$base"/nsis/*.exe "$base"/appimage/*.AppImage "$base"/deb/*.deb )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::aucun installeur trouvé dans $base"
            find src-tauri/target -maxdepth 5 -type d -name bundle || true
            exit 1
          fi
          ls -lh "${files[@]}"
          gh release upload "v${{ inputs.version }}" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
